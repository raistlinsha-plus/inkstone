[package]
name = "inkstone"
version = "0.8.1"
description = "Local Markdown editor and personal knowledge base"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
desktop-e2e = []

[lib]
name = "inkstone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
sqlite-vec = "0.1"
html5ever = "0.39"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "system-proxy"] }
tokio = { version = "1", features = ["time", "sync", "rt", "macros"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
jieba-rs = "0.7"
walkdir = "2"
pulldown-cmark = { version = "0.13", default-features = false }
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
zip = { version = "=9.0.5", default-features = false }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
security-framework-sys = "2.17"

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[profile.dev]
debug = 0
incremental = true
